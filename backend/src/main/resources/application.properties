# Desenvolvimento seguro: informe explicitamente todas as variáveis de ambiente.
# A ausência do datasource ou do segredo JWT deve impedir a inicialização.
spring.datasource.driver-class-name=org.postgresql.Driver
# Local: padrões abaixo. Produção (Render): DB_URL e DB_USERNAME vêm do ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/arthub_dev}
spring.datasource.username=${DB_USERNAME:arthub_app}
# Poucas conexões: o plano grátis do banco tem limite baixo.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.password=${DB_PASSWORD}

# Atualizar o schema durante o desenvolvimento.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Configuração do servidor
# O Render informa a porta em PORT; localmente fica 8080.
server.port=${PORT:8080}

# Segredo JWT obrigatório, fornecido pelo ambiente.
jwt.secret=${ARTHUB_DEV_JWT_SECRET}
jwt.expiration-ms=${ARTHUB_DEV_JWT_EXPIRATION_MS:86400000}

# Seed somente com perfil dev e habilitação explícita.
app.seed.enabled=${ARTHUB_DEV_SEED_ENABLED:false}
app.seed.password=${ARTHUB_DEV_SEED_PASSWORD:}

# Arquivos das tarefas (fatia 2): disco local no backend, acesso só autenticado.
app.storage.dir=${ARTHUB_STORAGE_DIR:uploads}
# Onde guardar: local (pasta acima; no Render grátis é apagada a cada deploy) ou s3
# (Cloudflare R2, Supabase Storage, Backblaze B2, AWS S3). Passo a passo no DEPLOY.md.
app.storage.type=${ARTHUB_STORAGE_TYPE:local}
app.storage.s3.endpoint=${ARTHUB_S3_ENDPOINT:}
app.storage.s3.region=${ARTHUB_S3_REGION:auto}
app.storage.s3.bucket=${ARTHUB_S3_BUCKET:}
app.storage.s3.access-key=${ARTHUB_S3_ACCESS_KEY:}
app.storage.s3.secret-key=${ARTHUB_S3_SECRET_KEY:}
app.storage.s3.path-style=${ARTHUB_S3_PATH_STYLE:true}
app.storage.s3.prefix=${ARTHUB_S3_PREFIX:}
app.storage.max-file-size-mb=500
# Cota por pessoa (arquivos de tarefa + imagens de posts), em MB. 0 = sem limite.
app.storage.quota-mb-per-user=${ARTHUB_STORAGE_QUOTA_MB:2048}

# Endereço público do site (links de nova senha).
app.public-url=${ARTHUB_PUBLIC_URL:http://localhost:8081}
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB
